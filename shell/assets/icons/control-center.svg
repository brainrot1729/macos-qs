<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  aria-label="Control Center"
>
  <!-- Top toggle: off -->
  <rect
    x="4"
    y="4"
    width="16"
    height="7"
    rx="3.5"
    stroke="currentColor"
    stroke-width="1.5"
  />
  <circle cx="7.5" cy="7.5" r="2.5" fill="currentColor"/>

  <!-- Bottom toggle: on -->
  <rect x="4" y="13" width="16" height="7" rx="3.5" fill="currentColor"/>
  <circle
    cx="16.5"
    cy="16.5"
    r="2.5"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
  />
</svg>
